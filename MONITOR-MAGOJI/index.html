<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapur Monitor — SASAGU</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0b1220;--card-wait:#3f1d1d;--card-wait-b:#7f1d1d;--card-done:#0f3a2a;--card-done-b:#059669;--ink:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
header h1{font-size:22px;margin:0;letter-spacing:.5px}
#clock{font-size:16px;color:var(--muted)}
#statusDot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{border-radius:16px;padding:18px;border:2px solid;transition:.2s}
.card.wait{background:var(--card-wait);border-color:var(--card-wait-b)}
.card.done{background:var(--card-done);border-color:var(--card-done-b);opacity:.65}
.qno{font-size:40px;font-weight:800;line-height:1}
.items{font-size:14px;color:#e2e8f0;margin:10px 0;min-height:40px}
.note{font-size:12px;color:#fbbf24;font-style:italic;margin-bottom:8px}
.status{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.card.wait .status{color:#fca5a5}
.card.done .status{color:#6ee7b7}
button.done-btn{width:100%;padding:12px;border:none;border-radius:10px;background:#059669;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button.done-btn:active{background:#047857}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-size:18px}
</style>
</head>
<body>
<header>
<h1>🍞 DAPUR MONITOR — SASAGU</h1>
<div><span id="statusDot"></span><span id="clock"></span></div>
</header>
<div id="debugBar" style="display:none;background:#7f1d1d;color:#fecaca;padding:8px 14px;border-radius:8px;font-size:12px;margin-bottom:14px"></div>
<div class="grid" id="grid"><div class="empty">Memuat antrian…</div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyDtY2WjdLCCSLsJlB3LaSkluVx1RuJISjQ",authDomain:"magoji-7f0cb.firebaseapp.com",projectId:"magoji-7f0cb",storageBucket:"magoji-7f0cb.firebasestorage.app",messagingSenderId:"945711636852",appId:"1:945711636852:web:5dadfdbe7ff9d7d62a4c21"};
let db=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){console.warn('Firebase init gagal:',e);}

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const dot=document.getElementById('statusDot');
const grid=document.getElementById('grid');
let subscribed=false;

function setStatus(online){dot.style.background=online?'#22c55e':'#ef4444';}

function subscribeQueue(){
if(subscribed)return;
if(!db){grid.innerHTML='<div class="empty">⚠️ Firebase belum terhubung.</div>';setStatus(false);return;}
subscribed=true;
const dbg=document.getElementById('debugBar');
db.collection('antrian_dapur').orderBy('createdAt','desc').limit(50).onSnapshot(snap=>{
setStatus(true);
dbg.style.display='none';
const orders=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.queueNo||0)-(b.queueNo||0));
render(orders);
},err=>{
console.warn('Gagal memantau antrian:',err);
setStatus(false);
dbg.style.display='block';
dbg.textContent='⚠️ Gagal memuat antrian. Error: '+(err.message||err.code||err);
});
}

function render(orders){
if(!orders.length){grid.innerHTML='<div class="empty">✅ Belum ada pesanan aktif.</div>';return;}
grid.innerHTML=orders.map(o=>{
const done=o.status==='selesai';
const itemsHtml=(o.items||[]).map(i=>`${esc(i.name)}${i.variantName?' ('+esc(i.variantName)+')':''} <b>x${i.qty}</b>`).join('<br>');
const notesHtml=(o.items||[]).filter(i=>i.notes).map(i=>`📝 ${esc(i.notes)}`).join('<br>');
return `<div class="card ${done?'done':'wait'}">
<div class="qno">#${o.queueNo}</div>
<div class="status">${done?'✅ Selesai':'⏳ Sedang Disiapkan'}</div>
<div class="items">${itemsHtml||'-'}</div>
${notesHtml?`<div class="note">${notesHtml}</div>`:''}
${!done?`<button class="done-btn" data-id="${o.id}">Tandai Selesai</button>`:''}
</div>`;
}).join('');
}

grid.addEventListener('click',e=>{
const btn=e.target.closest('[data-id]');if(!btn||!db)return;
btn.disabled=true;btn.textContent='Menyimpan…';
db.collection('antrian_dapur').doc(btn.dataset.id).update({
status:'selesai',
completedAt:firebase.firestore.FieldValue.serverTimestamp()
}).catch(err=>{console.warn('Gagal update status:',err);btn.disabled=false;btn.textContent='Tandai Selesai';});
});

function tickClock(){
const now=new Date();
document.getElementById('clock').textContent=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})+' • '+now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
subscribeQueue();
}
tickClock();
setInterval(tickClock,30000);

window.addEventListener('online',()=>setStatus(true));
window.addEventListener('offline',()=>setStatus(false));
</script>
</body>
</html>
